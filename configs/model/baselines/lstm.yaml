# Baseline: LSTM (recurrent baseline)
# Source: iTansformer_LSTM_CA_KAN-master/models/LSTM.py
model:
  name: "lstm"
  source: "senior_repo"
  d_model: 128
  n_layers: 3
  dropout: 0.1

train:
  batch_size: 128
  learning_rate: 1.0e-4
  optimizer: "adam"
  epochs: 150
  early_stop_patience: 10
  early_stop_delta: 1.0e-4
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.5
  scheduler_patience: 5
  loss: "mae"
