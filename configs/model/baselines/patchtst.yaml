# Baseline: PatchTST (patch-based baseline)
# Source: Time-Series-Library/models/PatchTST.py
model:
  name: "patchtst"
  source: "tsl"
  d_model: 128
  d_ff: 256
  e_layers: 2
  d_layers: 1
  n_heads: 8
  factor: 3
  patch_len: 16
  stride: 8
  dropout: 0.1
  embed: "timeF"
  freq: "t"
  activation: "gelu"

train:
  batch_size: 128
  learning_rate: 1.0e-4
  optimizer: "adam"
  epochs: 150
  early_stop_patience: 10
  early_stop_delta: 1.0e-4
  scheduler: "reduce_on_plateau"
  scheduler_factor: 0.5
  scheduler_patience: 5
  loss: "mae"
